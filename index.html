<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voyage-Vista home</title>
    <style>
        body {
            background-image: url('home.jpg');
            background-size: cover;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .slider {
            width: 100%;
            display: flex;
            overflow-x: auto; /* Enable horizontal scrolling */
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch; /* Enable touch scrolling */
        }

        .slider img {
            width: 200px;
            height: 150px;
            margin: 10px;
            border-radius: 15px;
            cursor: pointer;
        }

        .logo {
            padding-left: 1200px;
        }

        .content {
            background-color: rgba(0, 0, 0, 0.8); /* Semi-transparent background for better readability */
            padding: 20px;
            border-radius: 10px;
            margin: 20px;
        }

        h1 {
            font-family: 'Brush Script MT', cursive;
            font-size: 3em;
            color: white;
            text-align: center;
        }
        .blinking-text {
            font-size: 2em;
            color: white;
            animation: blink 3s infinite;
            padding-left:400px;
         } 
         @keyframes blink 
         { 0%, 50%, 100% { opacity: 1; } 25%, 75% { opacity: 0; } }

        .arrows {
            position: fixed;
            top: 50%;
            width: 100%;
            display: flex;
            justify-content: space-between;
            transform: translateY(-50%);
        }

        .arrow {
            font-size: 2em;
            color: white;
            cursor: pointer;
            padding: 10px;
        }

        .arrow.left {
            left: 0;
        }

        .arrow.right {
            right: 0;
        }

        /* Hide scrollbar for Webkit browsers */
        .slider::-webkit-scrollbar {
            display: none;
        }

        /* Hide scrollbar for other browsers */
        .slider {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>
</head>
<body>
    <div class="content">
        <h1>Welcome to VOYAGE-VISTA</h1>
        <div class="slider" id="slider">
            <!-- Images to be added here -->
            <img src="https://www.bing.com/images/search?view=detailV2&ccid=pYGlhGFh&id=7FEE150BDB9D780B38DFF320E4EDB319DC642906&thid=OIP.pYGlhGFhPfJhkMRhKDg6qAHaFP&mediaurl=https%3a%2f%2fwww.rajasthanfortsandpalaces.com%2fimages%2fcity%2fthumb%2f312641515759746608619567.jpg&exph=1400&expw=1980&q=delhu&simid=608049348774548407&FORM=IRPRST&ck=9D9A8FBF553A4974CDC541F4A9021B65&selectedIndex=3&itb=0" onclick="openPage('page1.html')" alt="delhi">
            <img src="https://thafd.bing.com/th/id/OIP.ctjxLFlGySEbcYHrBxM48gHaEo?cb=iwc1&rs=1&pid=ImgDetMain" onclick="openPage('page2.html')" alt="mumbai">
            <img src="https://static.toiimg.com/photo/67896140/agra-hotels.jpg?width=748&resize=4" onclick="openPage('page3.html')" alt="agra">
            <img src="https://www.fabhotels.com/blog/wp-content/uploads/2019/02/Hawa-Mahal.jpg" onclick="openPage('page4.html')" alt="jaipur">
            <img src="https://cdn.britannica.com/13/189813-050-BF6163E7/Manikarnika-Ghat-cremation-site-Hindu-Ganges-River.jpg" onclick="openPage('page5.html')" alt="varanasi">
            <img src="https://housing.com/news/wp-content/uploads/2023/04/Howrah-Bridge-Kolkata-Fact-guide-f.jpg" onclick="openPage('page6.html')" alt="kolkata">
            <img src="https://cdn.britannica.com/13/100813-050-708D93FE/Kapaleeswarar-temple-Hindu-Mylapore-Chennai-India-Tamil.jpg" onclick="openPage('page7.html')" alt="chennai">

            <img src="https://thafd.bing.com/th/id/OIP.1tANSZrMu2w7Lf1vDk0nXAHaEn?cb=iwc1&rs=1&pid=ImgDetMain" onclick="openPage('page9.html')" alt="bangalore">
            <img src="https://thafd.bing.com/th/id/OIP.I1pi0NdlDGxVRXeIiBJm1gHaE8?cb=iwc1&rs=1&pid=ImgDetMain" onclick="openPage('page10.html')" alt="pune">

        </div>
    </div>
    <div class="blinking-text">Get almost 25% off on your 1st booking..!</div>

    <div class="arrows">
        <div class="arrow left" onclick="scrollLeft()">
            <i class="fa fa-arrow-left"></i>
        </div>
        <div class="arrow right" onclick="scrollRight()">
            <i class="fa fa-arrow-right"></i>
        </div>
    </div>

    <script>
        function openPage(url) {
            window.location.href = url;
        }

        function scrollLeft() {
            document.getElementById('slider').scrollBy({
                left: -300,
                behavior: 'smooth'
            });
        }

        function scrollRight() {
            document.getElementById('slider').scrollBy({
                left: 300,
                behavior: 'smooth'
            });
        }

        function autoScroll() {
            const slider = document.getElementById('slider');
            let maxScrollLeft = slider.scrollWidth - slider.clientWidth;
            let scrollAmount = 0;

            function step() {
                scrollAmount += 1;
                if (scrollAmount >= maxScrollLeft) {
                    scrollAmount = 0;
                    slider.scrollLeft = scrollAmount;
                } else {
                    slider.scrollLeft += 1;
                }
            }

            setInterval(step, 25); // Adjust the interval for speed control
        }

        window.onload = autoScroll;
    </script>
</body>
</html>
